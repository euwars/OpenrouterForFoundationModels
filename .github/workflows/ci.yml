name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # On Linux the manifest selects the ServerFoundationModels backend with no
  # trait. This job is the systematic guarantee that default stays green, and
  # that forcing the trait there is harmless.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build (ServerFoundationModels backend, selected by platform)
        run: swift build --build-tests
      - name: Test (offline suites; live suites self-gate on OPENROUTER_API_KEY)
        run: swift test
      - name: Test with the trait forced (must be a no-op on Linux)
        run: swift test --traits ServerFoundationModels

  # The Apple-framework configuration needs an Xcode 27 (OS 27 SDK) host.
  # GitHub-hosted macOS runners don't ship it yet; enable this job when a
  # macos image with Xcode 27 lands.
  #
  # macos:
  #   runs-on: macos-27
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: swift test
  #     - run: swift test --traits ServerFoundationModels
